<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAKO - Game Tangkap Koin</title>
    <link rel="icon" type="image/png" href="public/assets/images/coin-tako.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="public/assets/css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="site-header" id="siteHeader">
        <div class="header-group lang-group">
            <button class="lang-btn active" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="id">ID</button>
        </div>
        <div class="header-group wallet-group" id="walletGroup" style="display: none;">
            <button class="btn-points" id="btnPoints" title="My Points">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="12" cy="12" r="10" fill="url(#coinGrad)"/>
                    <text x="12" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#8B6914">M</text>
                    <defs>
                        <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFD700"/>
                            <stop offset="50%" stop-color="#FFA500"/>
                            <stop offset="100%" stop-color="#FFD700"/>
                        </linearGradient>
                    </defs>
                </svg>
                <span class="points-value" id="pointsValue">0</span>
            </button>
            <button class="btn-help" id="btnHelp" title="How to Play">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
            </button>
            <span class="wallet-balance" id="walletBalance">-- MONAD</span>
            <span class="wallet-address" id="walletAddress"></span>
            <button class="btn-disconnect" id="btnDisconnect">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Animated Background -->
    <div class="scene" id="scene">
        <div class="sky"></div>
        <div class="clouds-container">
            <div class="cloud cloud-1"><img src="public/assets/images/cloud-a1.svg" alt=""></div>
            <div class="cloud cloud-2"><img src="public/assets/images/cloud-a2.svg" alt=""></div>
            <div class="cloud cloud-3"><img src="public/assets/images/cloud-b3.svg" alt=""></div>
            <div class="cloud cloud-4"><img src="public/assets/images/cloud-a3.svg" alt=""></div>
            <div class="cloud cloud-5"><img src="public/assets/images/cloud-b1.svg" alt=""></div>
            <div class="cloud cloud-6"><img src="public/assets/images/cloud-b2.svg" alt=""></div>
            <div class="cloud cloud-7"><img src="public/assets/images/cloud-b3.svg" alt=""></div>
            <div class="cloud cloud-8"><img src="public/assets/images/cloud-a2.svg" alt=""></div>
            <div class="cloud cloud-9"><img src="public/assets/images/cloud-a3.svg" alt=""></div>
            <div class="cloud cloud-10"><img src="public/assets/images/cloud-a1.svg" alt=""></div>
            <div class="cloud cloud-11"><img src="public/assets/images/cloud-a1.svg" alt=""></div>
            <div class="cloud cloud-12"><img src="public/assets/images/cloud-a2.svg" alt=""></div>
            <div class="cloud cloud-13"><img src="public/assets/images/cloud-b2.svg" alt=""></div>
            <div class="cloud cloud-14"><img src="public/assets/images/cloud-a3.svg" alt=""></div>
            <div class="cloud cloud-15"><img src="public/assets/images/cloud-b1.svg" alt=""></div>
            <div class="cloud cloud-16"><img src="public/assets/images/cloud-a2.svg" alt=""></div>
            <div class="cloud cloud-17"><img src="public/assets/images/cloud-a1.svg" alt=""></div>
            <div class="cloud cloud-18"><img src="public/assets/images/cloud-a3.svg" alt=""></div>
            <div class="cloud cloud-19"><img src="public/assets/images/cloud-b3.svg" alt=""></div>
            <div class="cloud cloud-20"><img src="public/assets/images/cloud-a2.svg" alt=""></div>
            <div class="cloud cloud-21"><img src="public/assets/images/cloud-b2.svg" alt=""></div>
            <div class="cloud cloud-22"><img src="public/assets/images/cloud-b3.svg" alt=""></div>
        </div>
        <div class="coins-container" id="coinsContainer"></div>
        <div class="basket-container">
            <img src="public/assets/images/basket.png" class="basket" alt="Basket">
        </div>
    </div>

    <!-- Login Page -->
    <div class="page" id="loginPage">
        <div class="container">
            <div class="content-card">
                <div class="logo-section">
                    <h1 class="logo">
                        <span class="logo-letter" data-letter="T">T</span>
                        <span class="logo-letter" data-letter="A">A</span>
                        <span class="logo-letter" data-letter="K">K</span>
                        <span class="logo-letter" data-letter="O">O</span>
                    </h1>
                    <p class="tagline" data-i18n="tagline" style="color: #ffffff;">Game Tangkap Koin Tako</p>
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" id="btnConnect">
                        <span class="btn-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/>
                                <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>
                            </svg>
                        </span>
                        <span data-i18n="btn_connect">Connect Wallet</span>
                    </button>
                    <button class="btn btn-secondary" id="btnAbout">
                        <span class="btn-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M12 16v-4"/>
                                <path d="M12 8h.01"/>
                            </svg>
                        </span>
                        <span data-i18n="btn_about">About</span>
                    </button>
                    <button class="btn btn-accent" id="btnContinue">
                        <span class="btn-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="5 3 19 12 5 21 5 3"/>
                            </svg>
                        </span>
                        <span data-i18n="btn_continue">Lanjutkan Permainan</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Page -->
    <div class="page" id="gamePage">
        <div class="game-area" id="gameArea">
            <div class="game-canvas-area" id="gameCanvas">
                <div class="score-display" id="scoreDisplay">
                    <div class="score-item">
                        <div class="score-label" data-i18n="label_coins">Coins</div>
                        <div class="score-value" id="coinsValue">0</div>
                    </div>
                    <div class="score-divider"></div>
                    <div class="score-item">
                        <div class="score-label" data-i18n="label_time">Time</div>
                        <div class="score-value" id="timeValue">60</div>
                    </div>
                    <div class="score-divider"></div>
                    <div class="score-item" id="playsScoreItem" style="display:none;">
                        <div class="score-label" data-i18n="plays_label">Plays</div>
                        <div class="score-value" id="playsValue">0/3</div>
                    </div>
                </div>
                <canvas id="gameCanvasElement"></canvas>
                <!-- Game Controls -->
                <div class="game-controls" id="gameControls">
                    <button class="ctrl-btn" id="ctrlLeft">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <button class="ctrl-btn" id="ctrlRight">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Payment Modal -->
    <div class="modal-overlay" id="paymentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 data-i18n="modal_title">Subscription Required</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="coin-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="10" fill="url(#coinGrad)"/>
                        <text x="12" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#8B6914">M</text>
                        <defs>
                            <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#FFD700"/>
                                <stop offset="50%" stop-color="#FFA500"/>
                                <stop offset="100%" stop-color="#FFD700"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <p class="modal-text" data-i18n="modal_text">Sewa aplikasi selama 1 Bulan</p>
                <p class="modal-amount">0.1 MONAD</p>
                <p class="modal-recipient">0x47b5...f48638</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-accent" id="btnPay">
                    <span data-i18n="btn_pay">Bayar Sekarang</span>
                </button>
                <button class="btn btn-outline" id="btnCancel">
                    <span data-i18n="btn_cancel">Batal</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <p class="footer-text">&copy; <span id="year"></span> Bro Edh | Web3 & Blockchain Developer. All Rights Reserved.</p>
    </footer>

    <!-- Sweet Alert Container -->
    <div class="sweet-overlay" id="sweetOverlay"></div>

    <!-- Web3 Provider -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.umd.min.js"></script>
    <script src="public/assets/js/app.js"></script>
</body>
</html>
